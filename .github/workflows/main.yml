name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          SRC=$(dirname "$(git ls-files '*CMakeLists.txt' | head -n 1)")
          echo "Project folder: $SRC"
          cmake -S "$SRC" -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VeltraneSampler-VST3-Windows
          path: build/VeltraneSampler_artefacts/Release/VST3/
        
